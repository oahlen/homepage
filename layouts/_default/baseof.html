<!doctype html>
<html
  class="light"
  id="root"
  lang="{{ or site.Language.Locale site.Language.Lang }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>

  <body
    class="bg-light-100 text-light-1000 dark:bg-dark-100 dark:text-dark-1000"
  >
    <header>{{ partial "header.html" . }}</header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer>{{ partial "footer.html" . }}</footer>
  </body>
</html>
